<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Deschide în Superbet</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --accent: #e30613; --card: #fff; --line: #deded8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #f2f2ee; --muted: #a3a39c; --card: #1f1f1d; --line: #34342f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
         border-radius: 14px; padding: 24px 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--muted); }
  a.btn { display: block; text-align: center; text-decoration: none; font-weight: 600;
          padding: 14px 16px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--line); color: var(--fg); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Meci Superbet</h1>
  <p id="msg">Deschide aplicația și caută meciul după numele jucătorilor.</p>
  <a id="app" class="btn primary" href="#">Deschide aplicația Superbet</a>
  <a id="web" class="btn" href="#">Deschide meciul pe site</a>
</main>
<script>
  // Pagina primește ?e=<event_id>&m=<Jucător 1 vs Jucător 2> de la monitorul live
  // (vezi livemon/superbet.py). Testat pe Android (2026-10-17): aplicația Superbet
  // nu acceptă linkuri spre un meci anume, iar Chrome nu pornește aplicații direct,
  // așa că butonul cere Google Play să pornească aplicația instalată.
  (function () {
    var PKG = "ro.superbet.sport";
    var q = new URLSearchParams(location.search);
    var id = (q.get("e") || "").replace(/\D/g, "");
    var match = (q.get("m") || "").slice(0, 120);
    var web = id ? "https://superbet.ro/cote/tenis/" + id : "https://superbet.ro/";

    if (match) document.getElementById("title").textContent = match;
    document.getElementById("web").href = web;
    if (!/Android/i.test(navigator.userAgent)) {
      document.getElementById("app").classList.add("hidden");
      document.getElementById("msg").textContent = "Deschiderea aplicației merge doar pe Android.";
      return;
    }
    document.getElementById("app").href = "market://launch?id=" + PKG;
  })();
</script>
</body>
</html>
