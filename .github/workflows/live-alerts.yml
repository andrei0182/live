name: Live tennis alerts (Telegram)

# La fiecare 20 de minute: citește pick-urile pending din andrei0182/pariuri
# (tennis/stats/picks_log.csv și model90_log.csv) și urmărește meciurile lor pe Superbet live timp de
# max. 18 minute, cu o verificare pe minut. Iese imediat dacă niciun pick nu
# e live și niciunul nu începe în fereastra asta.
# Secrete necesare: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Pragurile se pot schimba din Settings > Secrets and variables > Actions >
# Variables: ODDS_FACTOR, MIN_ODDS, MIN_MODEL_PCT, GAMES_DROP.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Trimite doar un mesaj de test pe Telegram"
        type: boolean
        default: false
      minutes:
        description: "Cât timp urmărește meciurile (minute)"
        type: choice
        options: ["18", "60", "120", "180"]
        default: "18"

concurrency:
  group: live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Acoperă și cea mai lungă rulare manuală (180 de minute) plus instalarea;
    # rulările programate se opresc singure după MAX_MINUTES.
    timeout-minutes: 195
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_FACTOR: ${{ vars.ODDS_FACTOR || '1.5' }}
      MIN_ODDS: ${{ vars.MIN_ODDS || '1.8' }}
      MIN_MODEL_PCT: ${{ vars.MIN_MODEL_PCT || '50' }}
      GAMES_DROP: ${{ vars.GAMES_DROP || '2' }}
      MAX_MINUTES: ${{ inputs.minutes || '18' }}
    steps:
      - name: Skip if Telegram secrets are missing
        if: env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == ''
        run: echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID lipsesc -- adaugă-le în Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v4
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''

      - uses: actions/setup-python@v5
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: pip install -r requirements.txt

      - name: Test Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && inputs.test_telegram
        run: python live_monitor.py --test-telegram

      # Regulile deja tratate și liniile pre-meci trec de la o rulare la alta prin cache.
      - name: Restore state
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && !inputs.test_telegram
        uses: actions/cache/restore@v4
        with:
          path: state
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-

      - name: Monitor
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && !inputs.test_telegram
        run: python live_monitor.py

      - name: Save state
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && !inputs.test_telegram && hashFiles('state/alerted.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: live-state-${{ github.run_id }}
